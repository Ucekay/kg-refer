[project]
name = "kg-refer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.1.0",
    "kg-cleaner",
    "kg-formatter",
    "kgat",
    "kgat-explainer",
    "light-kg",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "similarity-search",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]

[tool.uv.workspace]
members = [
    "packages/edc",
    "entity-canonicalizer",
    "packages/kgat-pt",
    "packages/kgat",
    "packages/kg-cleaner",
    "packages/kg-formatter",
    "packages/kgat-explainer",
    "packages/similarity-search",
    "packages/light-kg",
]

[tool.uv.sources]
kg-cleaner = { workspace = true }
kgat = { workspace = true }
kg-formatter = { workspace = true }
kgat-explainer = { workspace = true }
similarity-search = { workspace = true }
light-kg = { workspace = true }

[dependency-groups]
dev = [
    "basedpyright>=1.32.1",
    "ruff>=0.14.4",
]
