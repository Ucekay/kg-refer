[project]
name = "kgat-explainer"
version = "0.1.0"
description = "KGAT Explainer - Explain KGAT model predictions through path analysis"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.1.0",
    "kgat",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "torch>=2.9.0",
]

[project.scripts]
kgat-explainer = "kgat_explainer.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
kgat = { workspace = true }
