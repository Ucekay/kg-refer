[project]
name = "explainable-rec-prompt-generator"
version = "0.1.0"
description = "Generates explainable recommendation prompts for user-item pairs"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.1.0",
    "pandas>=2.0.0",
]

[project.scripts]
explainable-rec-prompt-generator = "explainable_rec_prompt_generator.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
