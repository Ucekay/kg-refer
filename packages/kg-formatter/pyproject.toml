[project]
name = "kg-formatter"
version = "0.1.0"
description = "Knowledge Graph ID remapping and formatting utilities"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.1.0",
]

[project.scripts]
kg-formatter = "kg_formatter.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
