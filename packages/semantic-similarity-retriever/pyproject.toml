[project]
name = "semantic-similarity-retriever"
version = "0.1.0"
description = "Semantic similarity-based node retrieval for knowledge graphs"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.1.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "sentence-transformers>=3.0.0",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
]

[project.scripts]
semantic-similarity-retriever = "semantic_similarity_retriever.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

