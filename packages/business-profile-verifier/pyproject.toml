[project]
name = "business-profile-verifier"
version = "0.1.0"
description = "Verify explanation outputs using Business profile as source"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.11.0",
    "cyclopts>=4.1.0",
    "numpy>=2.3.5",
    "regex>=2025.10.23",
    "spacy>=3.8.11",
    "thinc>=8.3.10",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
    "typer>=0.21.1",
]

[project.scripts]
business-profile-verifier = "business_profile_verifier.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
