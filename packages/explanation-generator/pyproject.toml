[project]
name = "explanation-generator"
version = "0.1.0"
description = "LLM-based explanation generator for recommendation systems"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.1.0",
    "openai>=2.6.1",
    "pandas>=2.3.3",
    "torch>=2.9.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.1",
]

[project.scripts]
explanation-generator = "explanation_generator.cli:app"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
