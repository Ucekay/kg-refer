[project]
name = "user-item-attribute-scorer"
version = "0.1.0"
description = "Calculate scores between user aggregated embeddings and item attribute aggregated embeddings"
readme = "README.md"
authors = [
    { name = "Ucekay", email = "Ucekay@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "torch>=2.9.0",
]

[project.scripts]
user-item-attribute-scorer = "user_item_attribute_scorer.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
